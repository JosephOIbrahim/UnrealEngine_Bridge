; ===========================================================================
;  Remote Control security posture for the UE Bridge
; ---------------------------------------------------------------------------
;  The bridge drives Unreal by executing editor Python over the Remote Control
;  API on localhost:30010. Unreal binds this server to 127.0.0.1 (localhost)
;  by default — do NOT set DefaultBindAddress to a LAN/public IP, which would
;  expose arbitrary editor control to the network. Run the bridge only on a
;  trusted local machine.
; ===========================================================================
[/Script/RemoteControlCommon.RemoteControlSettings]

; REQUIRED — the bridge executes UE Python over Remote Control. Turning this
; off disables every ue_* tool.
bEnableRemotePythonExecution=True

; HARDENING — the bridge runs console commands through Python
; (unreal.SystemLibrary.execute_console_command), NOT the Remote Control
; console endpoint, so that endpoint is disabled to shrink the remote
; arbitrary-exec surface.
bAllowConsoleCommandRemoteExecution=False

; Left False intentionally: enabling it makes the RC server require a passphrase
; on mutating requests, which the current MCP client does not send (it would
; break the bridge). Enabling it is a coordinated config + client change — see
; .planning/PRODUCTION_READINESS_REPORT.md. The server is already localhost-only
; by default, which is the primary network-exposure mitigation.
bRestrictServerAccess=False

; REQUIRED on UE 5.8+ -- 5.8 added bAllowAnyRemoteFunctionCall (default False),
; which blocks EVERY /remote/object/call. Without this, all codegen tools 400
; with "not allowed by remote control settings" -- the bridge worked on 5.7
; (where remote function calls were allowed) and silently broke on 5.8. Safe
; under the bridge's localhost-only, single-trusted-operator model, which
; already permits arbitrary Python execution over Remote Control.
bAllowAnyRemoteFunctionCall=True
