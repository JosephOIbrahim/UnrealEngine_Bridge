[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ue-bridge"
version = "2.1.0"
description = "MCP server bridging Claude Code to Unreal Engine 5 via Remote Control API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
usd = [
    "usd-core>=24.0",
]

[project.scripts]
ue-mcp = "ue_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
# Flat layout: the distribution name (ue-bridge) has no matching directory, so the
# first-party packages must be named explicitly — newer hatchling no longer
# auto-detects them, which broke `pip install -e .`.
packages = ["ue_mcp", "remote_control"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ue_mcp", "remote_control"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# mcp_server.py inserts the repo root on sys.path before importing first-party
# modules, so those imports legitimately come after executable statements.
"ue_mcp/mcp_server.py" = ["E402"]
